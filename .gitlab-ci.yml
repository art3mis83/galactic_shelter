stages:
  - build
  - unit
  - integration
  - api
  - e2e

variables:
  BACKEND_DIR: "galacticShelterBack"
  FRONTEND_DIR: "galacticShelterFront"
  FRONTEND_DIST: "galacticShelterFront/dist/galacticFront/browser"

cache:
  paths:
    - ~/.m2/repository
    - $FRONTEND_DIR/node_modules

# ------------------------------------------------------
# 1) BUILD BACKEND
# ------------------------------------------------------
build_backend:
  stage: build
  image: maven:3.9.9-eclipse-temurin-21
  script:
    - cd $BACKEND_DIR
    - mvn clean package -DskipTests
  artifacts:
    paths:
      - $BACKEND_DIR/target/*.jar
    expire_in: 1 hour

# ------------------------------------------------------
# 2) BUILD FRONTEND
# ------------------------------------------------------
build_frontend:
  stage: build
  image: node:20
  script:
    - cd $FRONTEND_DIR
    - npm ci
    - npm run build
  artifacts:
    paths:
      - $FRONTEND_DIST
    expire_in: 1 hour

