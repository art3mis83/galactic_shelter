# ------------------------------------------------------
# 4) INTEGRATION TESTS (Spring Boot Test)
# ------------------------------------------------------
integration_backend:
  stage: integration
  image: maven:3.9.9-eclipse-temurin-21
  script:
    - cd $BACKEND_DIR
    - mvn verify -Pintegration
  artifacts:
    when: always
    reports:
      junit:
        - $BACKEND_DIR/target/failsafe-reports/*.xml

# ------------------------------------------------------
# 5) API TESTS (Postman/Newman)
# ------------------------------------------------------
api_tests:
  stage: api
  image:
    name: cypress/included:15.2.0
    entrypoint: [ "" ]
  before_script:
    - apt-get update && apt-get install -y openjdk-21-jdk # Installe OpenJDK 17
    - cp ${BACKEND_DIR}/target/*.jar ./backend.jar
    - echo "Attempting to start backend..."
    - java -jar backend.jar > backend.log 2>&1 & # Lance le backend
    - echo "Backend started in background" # Affiche le PID du processus
    - npm install -g wait-on http-server # Installe ces utilitaires globalement pour npx

  script:
    - npx wait-on http://127.0.0.1:9000/actuator/health --timeout 60000
    - echo "Running Postman API tests with Newman..."
    - cd ${BACKEND_DIR} # Assurez-vous d'être dans le bon répertoire pour la collection Postman
    - npm install -g newman # Mieux d'installer par job, ou utiliser une image avec newman pré-installé
    - newman run src/test/postman/Galactic_Shelter.postman_collection.json \
      --reporters cli,junit \
      --reporter-junit-export newman-results.xml

# ------------------------------------------------------
# 6) E2E TESTS (Cypress)
# ------------------------------------------------------
e2e_tests:
  stage: e2e
  image:
    name: cypress/included:15.2.0
    entrypoint: [""]
  needs:
    - build_backend
    - build_frontend
  before_script:
    - apt-get update && apt-get install -y openjdk-21-jdk
    - cp ${BACKEND_DIR}/target/*.jar ./backend.jar
    - java -jar backend.jar > backend.log 2>&1 & # Lance le backend

    - npx http-server ${FRONTEND_DIR}/dist/galacticFront/browser -p 4200 --host 0.0.0.0 > frontend.log 2>&1 &
    - echo "Frontend is ready!"

    - npm install -g wait-on http-server
    - cd ${FRONTEND_DIR} # Assurez-vous d'être dans le répertoire du frontend où se trouve cypress
    - npx cypress install
  script:
    - npx wait-on http://127.0.0.1:9000/actuator/health http://127.0.0.1:4200 --timeout 60000
    - npx cypress run --browser chrome --config baseUrl=http://127.0.0.1:4200
  artifacts:
    when:
    paths:
      - backend.log
      - frontend.log
